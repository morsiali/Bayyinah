name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      AUTH_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
      AI_PROVIDER: local
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Unit and integration tests
        run: npx vitest run

      - name: Production build (includes type-check)
        run: npx next build
        env:
          DATABASE_URL: file:./build.db

      - name: Prepare end-to-end database
        run: |
          npx prisma db push --skip-generate
          npx tsx prisma/seed.ts
        env:
          DATABASE_URL: file:./e2e.db

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests (crawler, live workflow, mobile, demo)
        run: npx playwright test
        env:
          DATABASE_URL: file:./e2e.db
          STORAGE_DIR: ./storage-e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
